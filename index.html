];
const CATS = [
  { key: "all", label: "✨ 全部" },
  { key: "sweet", label: "🍬 甜美撒娇" },
  { key: "confident", label: "😎 自信反差" },
  { key: "badminton", label: "🏸 羽毛球梗" },
  { key: "lyric", label: "🎵 歌词向" },
  { key: "interact", label: "👯 互动召唤" },
  { key: "history", label: "🕘 历史" },
  { key: "fav", label: "❤️ 收藏" }
];
const CAT_LABEL = { sweet: "🍬 甜美撒娇", confident: "😎 自信反差", badminton: "🏸 羽毛球梗", lyric: "🎵 歌词向", interact: "👯 互动召唤" };
let curCat = "all";
let curItem = null;
let favs = [];
let hist = [];
try { favs = JSON.parse(localStorage.getItem("bwc_favs") || "[]"); } catch (e) { favs = []; }
try { hist = JSON.parse(localStorage.getItem("bwc_hist") || "[]"); } catch (e) { hist = []; }

const $ = (id) => document.getElementById(id);
const tabsEl = $("tabs"), textEl = $("text"), tagsEl = $("tags"), badgeEl = $("badge"),
      favBtn = $("favBtn"), toastEl = $("toast"), cardEl = $("card"),
      histList = $("histList"), footerBar = $("footerBar");

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function pool() {
  if (curCat === "all") return CORPUS;
  if (curCat === "fav") return CORPUS.filter(c => favs.includes(c.id));
  return CORPUS.filter(c => c.category === curCat);
}
// 不重复抽取：每个分类一个洗牌袋，抽完一轮再重新洗牌
const bags = {};
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pick() {
  const p = pool();
  if (!p.length) return null;
  const ids = new Set(p.map(c => c.id));
  let bag = (bags[curCat] || []).filter(id => ids.has(id));
  if (!bag.length) bag = shuffle(p.map(c => c.id));
  let id = bag.pop();
  if (curItem && id === curItem.id && bag.length) {
    const swap = bag.pop();
    bag.push(id);
    id = swap;
  }
  bags[curCat] = bag;
  const item = p.find(c => c.id === id) || null;
  if (item) {
    hist = [item.id, ...hist.filter(h => h !== item.id)].slice(0, 50);
    localStorage.setItem("bwc_hist", JSON.stringify(hist));
    if (bag.length === 0) {
      toast(curCat === "fav" ? "收藏已经全部刷完一轮啦~" : "该分类文案已经全部刷完啦~ 如果想要更多文案请联系昂哥 🏸");
    }
  }
  return item;
}
function render(item) {
  curItem = item;
  if (!item) {
    badgeEl.textContent = "❤️ 收藏";
    textEl.innerHTML = '<div class="empty" style="width:100%">还没有收藏哦<br>看到喜欢的点 🤍 收起来吧</div>';
    tagsEl.innerHTML = "";
    favBtn.textContent = "🤍";
    return;
  }
  badgeEl.textContent = CAT_LABEL[item.category] || "";
  textEl.textContent = item.text;
  tagsEl.innerHTML = item.tags.map(t => '<span class="tag">' + esc(t) + "</span>").join("");
  favBtn.textContent = favs.includes(item.id) ? "❤️" : "🤍";
  favBtn.classList.toggle("on", favs.includes(item.id));
  cardEl.style.animation = "none";
  void cardEl.offsetWidth;
  cardEl.style.animation = "";
}
function showHistory() {
  cardEl.hidden = true;
  footerBar.style.display = "none";
  histList.hidden = false;
  const items = hist.map(id => CORPUS.find(c => c.id === id)).filter(Boolean);
  if (!items.length) {
    histList.innerHTML = '<div class="empty">还没有历史记录<br>去抽几条文案吧~</div>';
    return;
  }
  histList.innerHTML = items.map(it =>
    '<div class="hist-item"><div class="ht">' + esc(it.text) + '</div><button class="hc" data-id="' + it.id + '">复制</button></div>'
  ).join("");
}
function showCardMode() {
  histList.hidden = true;
  cardEl.hidden = false;
  footerBar.style.display = "";
}
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}
async function copyItem(item) {
  if (!item) { toast("先抽一条文案吧～"); return; }
  const full = item.text + "\n" + item.tags.join(" ");
  try {
    await navigator.clipboard.writeText(full);
    toast("✅ 已复制，去粘贴吧！");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = full;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    toast("✅ 已复制，去粘贴吧！");
  }
}
tabsEl.innerHTML = CATS.map(c =>
  '<button class="tab' + (c.key === curCat ? " active" : "") + '" data-key="' + c.key + '">' + c.label + "</button>"
).join("");
tabsEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  curCat = btn.dataset.key;
  tabsEl.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === btn));
  if (curCat === "history") showHistory();
  else { showCardMode(); render(pick()); }
});
$("randomBtn").addEventListener("click", () => render(pick()));
$("copyBtn").addEventListener("click", () => copyItem(curItem));
histList.addEventListener("click", (e) => {
  const btn = e.target.closest(".hc");
  if (!btn) return;
  copyItem(CORPUS.find(c => c.id === btn.dataset.id));
});
favBtn.addEventListener("click", () => {
  if (!curItem) return;
  if (favs.includes(curItem.id)) {
    favs = favs.filter(f => f !== curItem.id);
    toast("已取消收藏");
  } else {
    favs.push(curItem.id);
    toast("❤️ 收藏成功");
  }
  localStorage.setItem("bwc_favs", JSON.stringify(favs));
  favBtn.textContent = favs.includes(curItem.id) ? "❤️" : "🤍";
  favBtn.classList.toggle("on", favs.includes(curItem.id));
  if (curCat === "fav") render(pick());
});
render(pick());
